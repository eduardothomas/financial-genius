name: Pruebas

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fg
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fg
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Instalar dependencias
        run: pnpm install --no-frozen-lockfile
      - name: Compilar paquetes
        run: pnpm turbo run build --filter="./packages/*"
      - name: Base de datos (migración + semilla)
        run: pnpm --filter @fg/db reset
      - name: Pruebas (una a la vez; comparten la BD)
        run: pnpm turbo run test --concurrency=1
