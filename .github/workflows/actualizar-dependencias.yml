name: Actualizar dependencias

# Genera pnpm-lock.yaml y alinea las versiones de Expo en una máquina con acceso a npm.
# Se dispara al subir una rama "actualizar-dependencias*" o a mano.
on:
  push:
    branches: ['actualizar-dependencias*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar (genera pnpm-lock.yaml)
        run: pnpm install --no-frozen-lockfile
      - name: Alinear versiones de Expo
        run: pnpm --filter @fg/app exec expo install --fix
      - name: Reinstalar con las versiones alineadas
        run: pnpm install --no-frozen-lockfile
      - name: Mostrar qué cambió
        run: git status --short && git diff --stat
      - name: Subir cambios a la rama
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add pnpm-lock.yaml '**/package.json'
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Dependencias: pnpm-lock.yaml y versiones de Expo alineadas" -m "Generado por el workflow Actualizar dependencias"
          git push origin HEAD:${{ github.ref_name }}
